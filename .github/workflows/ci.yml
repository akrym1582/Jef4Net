name: Unit tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - run: dotnet test -c Release --no-build --no-restore
      - run: dotnet test tests/Jef4Net.Tests -c Release --no-restore -p:LibraryTargetFramework=netstandard2.1
      - name: Verify generated tables
        run: |
          scripts/verify-generated.sh
      - name: Verify source provenance hashes
        run: scripts/verify-provenance.py
      - run: dotnet pack -c Release --no-build --no-restore -o artifacts
      - name: Verify package license contents
        run: scripts/verify-package.py artifacts/*.nupkg
      - run: dotnet restore samples/PackageSmoke --source "${{ github.workspace }}/artifacts"
      - run: dotnet run --project samples/PackageSmoke -c Release --no-restore
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*nupkg
