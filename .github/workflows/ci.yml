name: Unit tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - run: dotnet test -c Release --no-build --no-restore
      - run: dotnet test tests/Jef4Net.Tests -c Release --no-restore -p:LibraryTargetFramework=netstandard2.1
      - name: Verify generated tables
        run: |
          dotnet run --project src/Jef4Net.CodeGen -c Release --no-build -- data/jef4j src/Jef4Net/Fujitsu/Internal/Generated/FujitsuTables.g.cs
          git diff --exit-code -- src/Jef4Net/Fujitsu/Internal/Generated/FujitsuTables.g.cs
      - run: dotnet pack -c Release --no-build --no-restore -o artifacts
      - run: dotnet restore samples/PackageSmoke --source "${{ github.workspace }}/artifacts"
      - run: dotnet run --project samples/PackageSmoke -c Release --no-restore
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*nupkg
